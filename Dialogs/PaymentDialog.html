<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <link href="Simphony/POSTheme.css" rel="stylesheet" type="text/css" />
    <script src="Simphony/POSDialogAPI.js" charset="UTF-8"></script>

    <style>

        html, body {
            height: 100%;
            margin: 0;
            user-select: none;
        }

        .main {
            height: 100%;
            width: 100%;
            display: table;
        }

        .wrapper {
            display: table-cell;
            height: 100%;
            vertical-align: middle;
        }

        #btn_cancel_payment:hover {
            cursor: pointer;
            background-color: #A01220;
        }

        #btn_ok:hover {
            cursor: pointer;
            background-color: green;
        }
    </style>

    <script>

        var timeoutUpdate;
        var currencySuffix = "";

        function loadTranslations() {
            runContextMethod('GetLblRequested', (r) => setElem('lbl_requested', r));
            runContextMethod('GetLblInserted', (r) => setElem('lbl_inserted', r));
            runContextMethod('GetLblDispensed', (r) => setElem('lbl_dispensed', r));
            runContextMethod('GetLblNotDispensed', (r) => setElem('lbl_not_dispensed', r));
            runContextMethod('GetLblCancel', (r) => setElem('btn_cancel_payment', r));
            runContextMethod('GetLblOk', (r) => setElem('btn_ok', r));
        }

        function refreshUI() {
            runContextMethod('GetRequested', (r) => setAmountElem('requested', r));
            runContextMethod('GetInserted', (r) => setAmountElem('inserted', r));
            runContextMethod('GetDispensed', (r) => setAmountElem('dispensed', r));
            runContextMethod('GetNotDispensed', (r) => setAmountElem('not_dispensed', r));
            runContextMethod('GetCloseWindow', (r) => processWindowsClose(r));
            runContextMethod('CanCancel', (r) => processCanCancel(r));
            runContextMethod('GetNotDispensedWarning', (r) => processConfirmRequest(r));

            timeoutUpdate = setTimeout(refreshUI, 250);
        }

        function onload() {
            loadTranslations();
            runContextMethod('GetCurrency', (r) => {
                currencySuffix = r ? " " + r : "";
                refreshUI();
            });
        }

        function cancelClick() {
            runContextMethod('BtnCancelClick', (r) => { });
        }

        function safeExitClick() {
            runContextMethod('BtnSafeExitClick', (r) => { });
        }

        function okClick() {
            runContextMethod('BtnNotDispensedOkClick', (r) => { });
        }

        function runContextMethod(method, callback) {
            let parms = new SimphonyPOSAPI_ContextMethodParameters();
            parms.method = method;
            return SimphonyPOSAPI.runContextMethod(parms, (parmsOut) => processResponse(parmsOut, callback));
        }

        function processResponse(parmsOut, callback) {
            if (parmsOut.isSuccess()) {
                if (callback)
                    callback(parmsOut.response);
            }
            else if (parmsOut.isError())
                alert('Error: ' + parmsOut.response);
            else if (parmsOut.isTimeout())
                alert('Timeout');
        }

        function setElem(id, data) {
            document.getElementById(id).innerText = data;
        }

        function setAmountElem(id, data) {
            document.getElementById(id).innerText = data + currencySuffix;
        }

        function processWindowsClose(data) {
            if (data != true) {
                return;
            }

            clearTimeout(timeoutUpdate);

            if (SimphonyPOSAPI.DebugMode)
                setTimeout(function () { window.close(); }, 250);

            SimphonyPOSAPI.closeDialog("completed");
        }

        function processCanCancel(data) {
            document.getElementById('btn_cancel_payment').hidden = !data;
        }

        function processConfirmRequest(data) {
            document.getElementById('btn_ok').hidden = !data;
        }
    </script>

</head>
